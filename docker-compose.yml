services:
  target:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - ./examples:/app:ro
    command: python target_api.py

  fuzz:
    build: .
    volumes:
      - ./results:/opt/apifuzz/results
    command:
      - -spec
      - examples/openapi.json
      - -base-url
      - http://target:9101
      - -out
      - results/results.jsonl
    depends_on:
      - target
